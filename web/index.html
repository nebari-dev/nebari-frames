<!doctype html>
<html lang="en">
  <head>
    <!--
      Applies the saved (or OS) theme before first paint so there is no flash
      of the wrong theme. Generated by themeBootstrapScript("nebari-frames:themeMode")
      from @/hooks/use-theme-preference — regenerate after changing the storage
      key (see THEME_STORAGE_KEY in src/app/Providers.tsx).
    -->
    <script>
      (function () {
        var mode = null;
        var prefersDark = false;
        try {
          mode = localStorage.getItem("nebari-frames:themeMode");
        } catch (e) {}
        try {
          prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {}
        var isDark = mode === 'dark' || (mode !== 'light' && prefersDark);
        try {
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
    <title>Nebari Frames</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
