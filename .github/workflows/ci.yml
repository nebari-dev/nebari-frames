name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Lint proto
        working-directory: proto
        run: buf lint
      - name: Generated code is up to date
        run: |
          (cd proto && buf generate)
          git add -A gen/
          if ! git diff --cached --exit-code -- gen/; then
            echo "::error::Generated code is stale. Run 'make proto' and commit the result."
            exit 1
          fi

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned to a minor series: a new golangci-lint release can add
          # default linters and redden every PR overnight. Bump deliberately.
          version: v2.12
      - name: Test
        run: go test ./... -race -coverprofile=coverage.out

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint chart
        run: helm lint chart/
      - name: Template renders (NebariApp mode)
        run: |
          helm template frames chart/ \
            --set nebariapp.enabled=true \
            --set nebariapp.hostname=frames.example.com \
            --set seed.orgSlug=test-org \
            --set seed.adminEmail=admin@example.com \
            > /tmp/render-nebariapp.yaml
      - name: Template renders (dev mode)
        run: |
          helm template frames chart/ --set auth.devMode=true \
            > /tmp/render-devmode.yaml
      - name: Template renders (trust bundle)
        run: |
          helm template frames chart/ --set auth.devMode=true \
            --set trustBundle.configMapName=nebari-trust-bundle \
            > /tmp/render-trustbundle.yaml
          # Assert on content, not just that it rendered: the whole point of
          # the block is the mount and the env var, and a silently-empty
          # render would still pass kubeconform below.
          for want in \
            'name: SSL_CERT_FILE' \
            'value: "/etc/ssl/nebari/ca-certificates.crt"' \
            'mountPath: "/etc/ssl/nebari"' \
            'name: "nebari-trust-bundle"'; do
            grep -qF "${want}" /tmp/render-trustbundle.yaml \
              || { echo "::error::trust-bundle render is missing: ${want}"; exit 1; }
          done
          # ...and that it stays opt-in: no trust-bundle wiring by default.
          if grep -q 'SSL_CERT_FILE' /tmp/render-devmode.yaml; then
            echo "::error::SSL_CERT_FILE rendered without trustBundle.configMapName set"
            exit 1
          fi
      - name: Validate rendered manifests (kubeconform)
        run: |
          # -ignore-missing-schemas is required because the NebariApp CRD has
          # no published JSON schema anywhere; do not remove this flag without
          # publishing one first.
          for f in /tmp/render-nebariapp.yaml /tmp/render-devmode.yaml \
                   /tmp/render-trustbundle.yaml; do
            echo "::group::kubeconform ${f}"
            # Pinned for the same reason golangci-lint is: a new release must
            # not change gate behavior without a deliberate bump. v0.8+ needs
            # go >= 1.26, which setup-go's GOTOOLCHAIN=local forbids on this
            # repo's go 1.25 toolchain; bump both together.
            go run github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0 \
              -strict -summary -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "${f}"
            echo "::endgroup::"
          done

  e2e-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build frames image
        run: docker build --platform=linux/amd64 -t nebari-frames:e2e .

      - name: Pin MetalLB's pool to the kind Docker network
        id: metallb
        run: |
          # NIC is supposed to derive MetalLB's IPAddressPool from the kind
          # Docker network, but the derived value is cached on the provider
          # instance during Deploy and is not what the IPAddressPool ends up
          # with: the pool gets NIC's unroutable 192.168.1.100-110 fallback
          # instead, so the gateway LoadBalancer IP has no route from the
          # runner and every request to it times out. An explicitly configured
          # pool takes precedence over both, so pin it ourselves. Upstream:
          # nebari-dev/nebari-infrastructure-core#612. Once that is fixed and
          # released, this step and the nic-config below can both be dropped in
          # favour of the action's own config template.
          #
          # Derive it from the network kind will actually use rather than
          # hardcoding a range, so this self-corrects if Docker picks a
          # different subnet. kind reuses a bridge network named `kind` when one
          # already exists, so creating it up front fixes the subnet without
          # fighting kind for it.
          docker network create --driver bridge --subnet 172.18.0.0/16 kind 2>/dev/null \
            || echo "network 'kind' already exists; using its subnet as-is"
          SUBNET=$(docker network inspect kind --format '{{ (index .IPAM.Config 0).Subnet }}')
          # Mirrors NIC's own formula: the .100-.110 range of the subnet's last
          # /24 block (172.18.0.0/16 -> 172.18.255.100-172.18.255.110).
          POOL=$(python3 -c '
          import ipaddress, sys
          net = ipaddress.ip_network(sys.argv[1])
          if net.prefixlen > 24:
              raise SystemExit(f"kind network {net} is smaller than a /24")
          last = ipaddress.ip_network(f"{net.broadcast_address}/24", strict=False)
          print(f"{last[100]}-{last[110]}")
          ' "${SUBNET}")
          echo "kind network ${SUBNET} -> MetalLB pool ${POOL}"
          echo "pool=${POOL}" >> "$GITHUB_OUTPUT"

      - name: Write the NIC config
        run: |
          # Supplying a config means the action skips its own template, so this
          # has to restate the platform defaults it would otherwise set.
          # `project_name` MUST equal the sandbox `cluster-name` below, and the
          # providers must both be `local`, or the action's outputs do not
          # resolve.
          cat > /tmp/nic-config.yaml <<EOF
          project_name: nebari-test
          domain: nebari.local
          certificate:
            type: selfsigned
          cluster:
            local:
              metallb:
                address_pool: ${{ steps.metallb.outputs.pool }}
          repository:
            local: {}
          EOF
          cat /tmp/nic-config.yaml

      - uses: nebari-dev/action-nebari-sandbox@v3
        id: sandbox
        with:
          # Pinned rather than tracking `latest`, so a NIC release cannot turn
          # this job red without a deliberate bump. v3 requires NIC >= v0.13.0
          # (the local/kind cluster + local repository providers).
          nic-version: v0.13.0
          nic-config: /tmp/nic-config.yaml
          # Must match `project_name` in the config above.
          cluster-name: nebari-test

      - name: Import image into the sandbox cluster
        # v3 deploys via NIC's local provider, which is kind, not k3d. `kind` is
        # preinstalled on ubuntu-latest; the kind cluster name is the action's
        # cluster-name output (its kubectl context is `kind-<cluster-name>`).
        run: kind load docker-image nebari-frames:e2e --name ${{ steps.sandbox.outputs.cluster-name }}

      - name: Make *.nebari.local resolve inside the cluster
        env:
          KUBECONFIG: ${{ steps.sandbox.outputs.kubeconfig }}
          GATEWAY_IP: ${{ steps.sandbox.outputs.gateway-ip }}
          DOMAIN: nebari.local
        run: |
          # The sandbox action's own in-cluster DNS step is a no-op on kind. It
          # writes a `coredns-custom` ConfigMap, which is a k3s convention (k3s
          # CoreDNS mounts it and does `import /etc/coredns/custom/*.server`);
          # kind's CoreDNS comes from kubeadm with a plain `.:53` Corefile and
          # no such import, so the ConfigMap is never read and pods get SERVFAIL
          # for nebari.local. The action still logs "In-cluster DNS ready".
          # Upstream: nebari-dev/action-nebari-sandbox#104.
          #
          # Keycloak advertises the external issuer in its discovery document,
          # so the frames pod has to resolve keycloak.nebari.local to complete
          # OIDC discovery. Add the zone to the Corefile that kind actually
          # reads. Remove this once the action handles kind.
          [ -n "${GATEWAY_IP}" ] || { echo "::error::gateway-ip is empty"; exit 1; }
          CORE=$(kubectl -n kube-system get configmap coredns -o jsonpath='{.data.Corefile}')
          [ -n "${CORE}" ] || { echo "::error::could not read kind's coredns Corefile"; exit 1; }

          # Merge-patch only the Corefile key so nothing else in the ConfigMap
          # is disturbed, and skip if the zone is already there so a re-run is
          # not additive.
          PATCH=$(COREFILE="${CORE}" python3 <<'PY'
          import json, os
          domain, ip, core = os.environ["DOMAIN"], os.environ["GATEWAY_IP"], os.environ["COREFILE"]
          if f"{domain}:53" in core:
              block = ""
          else:
              # `template` is the only stock plugin that answers a wildcard, and
              # AAAA/ANY return empty NOERROR so dual-stack resolvers do not
              # stall and other qtypes do not SERVFAIL in an authoritative zone.
              block = (
                  f"{domain}:53 {{\n"
                  "    errors\n"
                  f"    template IN A {domain} {{\n"
                  '        answer "{{ .Name }} 60 IN A ' + ip + '"\n'
                  "    }\n"
                  f"    template IN AAAA {domain} {{\n"
                  "        rcode NOERROR\n"
                  "    }\n"
                  f"    template IN ANY {domain} {{\n"
                  "        rcode NOERROR\n"
                  "    }\n"
                  "}\n\n"
              )
          print(json.dumps({"data": {"Corefile": block + core}}))
          PY
          )
          kubectl -n kube-system patch configmap coredns --type merge --patch "${PATCH}"
          kubectl -n kube-system rollout restart deployment/coredns
          kubectl -n kube-system rollout status deployment/coredns --timeout=120s

          # Prove it from inside the cluster. Without this the failure surfaces
          # 15 minutes later as an unexplained unhealthy Application, which is
          # how the upstream no-op went unnoticed in the first place.
          #
          # Wait rather than sampling once. `rollout status` reports the new
          # CoreDNS pods Ready before the new Corefile is necessarily live in
          # them: a ConfigMap mounted as a volume propagates on kubelet's sync
          # interval, and CoreDNS reloads on a poll of its own. A single probe
          # fired straight after the rollout therefore loses a race roughly half
          # the time, and a lost race is indistinguishable from the real
          # misconfiguration this check exists to catch. Retrying to a deadline
          # makes slow propagation read as slow and leaves only genuine breakage
          # reading as broken.
          RESOLVED=0
          for attempt in $(seq 1 24); do
            kubectl delete pod dns-probe --ignore-not-found >/dev/null 2>&1
            OUT=$(kubectl run dns-probe --image=busybox:1.36 --restart=Never \
              --attach --rm --quiet --image-pull-policy=IfNotPresent \
              --command -- nslookup "keycloak.${DOMAIN}" 2>&1) || true
            if echo "${OUT}" | grep -qF "${GATEWAY_IP}"; then
              RESOLVED=1
              echo "OK: keycloak.${DOMAIN} resolves to ${GATEWAY_IP} for pods (attempt ${attempt})"
              break
            fi
            echo "[${attempt}/24] keycloak.${DOMAIN} not resolving yet"
            sleep 5
          done
          if [ "${RESOLVED}" != "1" ]; then
            echo "::error::keycloak.${DOMAIN} does not resolve to ${GATEWAY_IP} from inside the cluster after 24 attempts"
            echo "last probe output:"
            echo "${OUT}"
            echo "Corefile the ConfigMap currently holds:"
            kubectl -n kube-system get configmap coredns -o jsonpath='{.data.Corefile}' || true
            exit 1
          fi

      - name: Provision the sandbox CA for the frames pod
        env:
          KUBECONFIG: ${{ steps.sandbox.outputs.kubeconfig }}
          CA_CERT_PATH: ${{ steps.sandbox.outputs.ca-cert-path }}
        run: |
          # Real auth needs the pod to trust the sandbox's self-signed gateway
          # CA, or OIDC discovery against https://keycloak.nebari.local fails
          # and /readyz never turns 200. The action hands us the CA as a file on
          # the runner, so build the ConfigMap from that rather than copying the
          # in-cluster `nebari-sandbox-ca` out of kube-public (a ConfigMap
          # cannot be mounted across namespaces).
          [ -s "${CA_CERT_PATH}" ] \
            || { echo "::error::sandbox ca-cert-path is empty or missing: '${CA_CERT_PATH}'"; exit 1; }

          # Create the namespace up front, carrying the opt-in label the
          # operator requires. ArgoCD's CreateNamespace=true tolerates an
          # existing namespace, and the ConfigMap is untracked by ArgoCD so
          # `prune: true` leaves it alone.
          kubectl create namespace nebari-frames --dry-run=client -o yaml \
            | kubectl apply -f -
          kubectl label namespace nebari-frames nebari.dev/managed=true --overwrite

          # NOTE: this is the gateway CA alone, not public roots + CA as the
          # chart's trustBundle contract asks for. Fine here (frames only talks
          # to in-cluster Keycloak), but it means SSL_CERT_FILE narrows the
          # pod's trust to this one CA, so the job does not exercise the
          # complete-bundle case a production cluster would use.
          kubectl create configmap nebari-sandbox-ca \
            --from-file=ca-certificates.crt="${CA_CERT_PATH}" \
            -n nebari-frames --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy frames via GitOps
        env:
          GITOPS_DIR: ${{ steps.sandbox.outputs.gitops-dir }}
        run: |
          cp -r chart "${GITOPS_DIR}/nebari-frames-chart"
          cat > "${GITOPS_DIR}/apps/nebari-frames.yaml" <<EOF
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: nebari-frames
            namespace: argocd
          spec:
            # Consumer apps must use the `nebari-apps` project. NIC locks the
            # `default` project down to an empty sourceRepos/destinations
            # deny-all, so an Application in it is rejected with
            # InvalidSpecError and never syncs.
            project: nebari-apps
            source:
              repoURL: "file://${GITOPS_DIR}"
              targetRevision: HEAD
              path: nebari-frames-chart
              helm:
                releaseName: nebari-frames
                values: |
                  image:
                    repository: nebari-frames
                    tag: e2e
                  # Real auth, not dev mode. The operator provisions the
                  # OIDC clients and the pod must complete discovery against
                  # https://keycloak.nebari.local before /readyz turns 200, so
                  # the Synced/Healthy wait below is itself the assertion that
                  # in-cluster DNS, CA trust, and client provisioning all work.
                  nebariapp:
                    enabled: true
                    hostname: frames.nebari.local
                    auth:
                      enabled: true
                  # Trust the sandbox gateway CA staged into the namespace by
                  # the step above; without it discovery fails on an unknown
                  # authority.
                  trustBundle:
                    configMapName: nebari-sandbox-ca
                  seed:
                    orgSlug: e2e-org
                    orgDisplayName: E2E Org
                    adminEmail: e2e@example.com
            destination:
              server: https://kubernetes.default.svc
              namespace: nebari-frames
            syncPolicy:
              # The operator only manages apps in namespaces that opt in with
              # this label; without it, spec validation fails silently and the
              # OIDC client secret is never provisioned (mirrors production).
              managedNamespaceMetadata:
                labels:
                  nebari.dev/managed: "true"
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
                - ServerSideApply=true
                - SkipDryRunOnMissingResource=true
          EOF
          git -C "${GITOPS_DIR}" add -A
          git -C "${GITOPS_DIR}" \
            -c user.email=ci@nebari-frames \
            -c user.name=frames-e2e \
            commit -m "test: deploy nebari-frames e2e"
          chmod -R a+rX "${GITOPS_DIR}"

      - name: Wait for Application Synced and Healthy
        env:
          KUBECONFIG: ${{ steps.sandbox.outputs.kubeconfig }}
        run: |
          SUCCESS=0
          DEGRADED=0
          for i in $(seq 1 90); do
            SYNC=$(kubectl get application/nebari-frames -n argocd \
              -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "NotFound")
            HEALTH=$(kubectl get application/nebari-frames -n argocd \
              -o jsonpath='{.status.health.status}' 2>/dev/null || echo "-")
            echo "[${i}/90] sync=${SYNC} health=${HEALTH}"
            if [ "${SYNC}" = "Synced" ] && [ "${HEALTH}" = "Healthy" ]; then
              SUCCESS=1
              break
            fi
            # Fail fast only on SUSTAINED Degraded: apps pass through Degraded
            # transiently while pods start, so a single sample is not a verdict.
            if [ "${HEALTH}" = "Degraded" ]; then
              DEGRADED=$((DEGRADED + 1))
            else
              DEGRADED=0
            fi
            if [ "${DEGRADED}" -ge 12 ]; then
              echo "::error::Application stuck Degraded for 2 minutes, failing fast"
              break
            fi
            sleep 10
          done
          if [ "${SUCCESS}" = "1" ]; then
            exit 0
          fi
          echo "::error::Application never reached Synced/Healthy"
          kubectl get application/nebari-frames -n argocd -o yaml || true
          kubectl -n nebari-frames get pods -o wide || true
          kubectl -n nebari-frames describe pods || true
          echo "=== NebariApp CR (operator's view of auth provisioning) ==="
          kubectl -n nebari-frames get nebariapps.reconcilers.nebari.dev -o yaml || true
          echo "=== Secrets in nebari-frames namespace ==="
          kubectl -n nebari-frames get secrets || true
          echo "=== frames pod logs (tail) ==="
          kubectl -n nebari-frames logs --tail=100 deploy/nebari-frames-nebari-frames 2>/dev/null || true
          echo "=== Operator pods ==="
          kubectl get pods -A | grep -i operator || true
          echo "=== Operator Keycloak wiring (env) ==="
          kubectl -n nebari-operator-system get deploy nebari-operator-controller-manager \
            -o jsonpath='{.spec.template.spec.containers[*].env}' 2>/dev/null || true
          echo ""
          echo "=== nebari-operator logs (tail) ==="
          kubectl -n nebari-operator-system logs --tail=150 -l control-plane=controller-manager 2>/dev/null \
            || kubectl -n nebari-operator-system logs --tail=150 deploy/nebari-operator-controller-manager 2>/dev/null \
            || true
          exit 1

      - name: Auth is really on (not silently dev mode)
        env:
          KUBECONFIG: ${{ steps.sandbox.outputs.kubeconfig }}
        run: |
          # Guard against a vacuous pass. Healthy above proves /readyz is 200,
          # but dev mode also reports ready - so without this, a chart change
          # that quietly fell back to devMode would still look green and the
          # OIDC path would go untested. (Exactly how the sandbox action's
          # gateway-ip check passed for months without connecting to anything:
          # nebari-dev/action-nebari-sandbox#103.)
          ENV_JSON=$(kubectl -n nebari-frames get deploy nebari-frames-nebari-frames \
            -o jsonpath='{.spec.template.spec.containers[0].env}')
          echo "container env: ${ENV_JSON}"
          case "${ENV_JSON}" in
            *FRAMES_DEV_MODE*)
              echo "::error::FRAMES_DEV_MODE is set - the pod is in dev mode, so real auth was not exercised"
              exit 1 ;;
          esac
          case "${ENV_JSON}" in
            *OIDC_ISSUER_URL*) ;;
            *) echo "::error::OIDC_ISSUER_URL is absent - auth is not wired at all"; exit 1 ;;
          esac
          # Readiness proves discovery succeeded; this proves it succeeded via
          # the mounted bundle rather than by some other route, so a silently
          # dropped volume shows up here instead of passing unnoticed.
          kubectl -n nebari-frames get deploy nebari-frames-nebari-frames \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="SSL_CERT_FILE")].value}' \
            | grep -qF '/etc/ssl/nebari/ca-certificates.crt' \
            || { echo "::error::SSL_CERT_FILE is not pointing at the mounted trust bundle"; exit 1; }
          echo "OK: real auth, OIDC wired, trust bundle mounted"

      - name: Endpoint answers through the gateway
        env:
          GATEWAY_IP: ${{ steps.sandbox.outputs.gateway-ip }}
        run: |
          CODE=$(curl -sk -o /tmp/resp -w '%{http_code}' \
            --max-time 30 \
            --resolve "frames.nebari.local:443:${GATEWAY_IP}" \
            https://frames.nebari.local/ || echo 000)
          echo "HTTP ${CODE}"
          head -c 500 /tmp/resp; echo
          case "${CODE}" in
            200|302|303|307) echo "endpoint OK" ;;
            *) echo "::error::unexpected HTTP ${CODE}"; exit 1 ;;
          esac

      - name: Resolve the gateway host names for the runner
        env:
          GATEWAY_IP: ${{ steps.sandbox.outputs.gateway-ip }}
          CA_CERT_PATH: ${{ steps.sandbox.outputs.ca-cert-path }}
        run: |
          # Both the token-acquisition step and the blackbox suite below talk
          # to frames.nebari.local and keycloak.nebari.local from the runner
          # itself rather than from inside the cluster. curl can fake that with
          # --resolve per call, but Go's http.Client has no equivalent, and the
          # generated Connect client needs a real base URL it can dial - so a
          # genuine hosts entry is the only thing that works for both.
          echo "${GATEWAY_IP} frames.nebari.local keycloak.nebari.local" | sudo tee -a /etc/hosts

          # Exported via GITHUB_ENV so every later step inherits it: the gateway
          # presents the sandbox's self-signed CA, and pointing SSL_CERT_FILE at
          # it is what lets both curl and the Go suite verify the connection
          # for real instead of skipping verification.
          echo "SSL_CERT_FILE=${CA_CERT_PATH}" >> "$GITHUB_ENV"

      - name: Provision an e2e Keycloak identity
        id: token
        env:
          KUBECONFIG: ${{ steps.sandbox.outputs.kubeconfig }}
        run: |
          REALM=nebari
          KC_BASE=https://keycloak.nebari.local
          # --cacert rather than the SSL_CERT_FILE the Go suite relies on below:
          # Go's crypto/x509 documents honoring that env var on Linux, but curl's
          # pickup of it depends on how the runner's curl was built against
          # OpenSSL, which is not a bet worth making for a suite whose whole
          # point is verifying the real certificate.
          CACERT="${SSL_CERT_FILE}"

          # The operator authenticates to Keycloak's admin API with these same
          # credentials to provision every NebariApp's OIDC client (see
          # nebari-operator's KeycloakConfig / KEYCLOAK_ADMIN_SECRET_NAME,
          # default "keycloak-admin-credentials" in the "keycloak" namespace).
          # Reusing them here means this step fails the same way the operator's
          # own provisioning would if the admin API ever rejected them, rather
          # than depending on a credential nothing else exercises.
          KC_ADMIN_USER=$(kubectl -n keycloak get secret keycloak-admin-credentials -o jsonpath='{.data.admin-username}' | base64 -d)
          KC_ADMIN_PASS=$(kubectl -n keycloak get secret keycloak-admin-credentials -o jsonpath='{.data.admin-password}' | base64 -d)

          ADMIN_TOKEN_RESPONSE=$(curl -s --cacert "${CACERT}" -X POST "${KC_BASE}/realms/master/protocol/openid-connect/token" \
            -d grant_type=password -d client_id=admin-cli \
            -d "username=${KC_ADMIN_USER}" -d "password=${KC_ADMIN_PASS}")
          ADMIN_TOKEN=$(echo "${ADMIN_TOKEN_RESPONSE}" | jq -r '.access_token')
          [ -n "${ADMIN_TOKEN}" ] && [ "${ADMIN_TOKEN}" != "null" ] \
            || { echo "::error::could not obtain a Keycloak master admin token: ${ADMIN_TOKEN_RESPONSE}"; exit 1; }

          # The backend validates the token's aud claim against OIDC_CLIENT_ID,
          # which the chart wires to the operator-provisioned SPA client, not
          # the confidential client naming.ClientID() would suggest (see
          # docs/qa/e2e-token-acquisition.md, and backend/internal/auth/validator.go's
          # oidc.Config{ClientID: cfg.ClientID}). Reading it out of the secret
          # the operator actually wrote, rather than re-deriving the "<ns>-<app>-spa"
          # naming convention here, means a convention change breaks this loudly
          # at the read below instead of silently at token validation in CI.
          SPA_CLIENT_ID=$(kubectl -n nebari-frames get secret nebari-frames-nebari-frames-oidc-client \
            -o jsonpath='{.data.spa-client-id}' | base64 -d)
          [ -n "${SPA_CLIENT_ID}" ] \
            || { echo "::error::spa-client-id is empty in the operator-provisioned OIDC secret"; exit 1; }

          # A purpose-provisioned client: the SPA client the operator provisions
          # has directAccessGrantsEnabled=false (it exists for the browser's PKCE
          # flow, not password grants), so automated tests need their own. The
          # audience mapper is the detail that actually matters here - without
          # it the token's aud is this client's own id, which the backend
          # rejects; see docs/qa/e2e-token-acquisition.md for how that was found.
          CREATE_CLIENT_CODE=$(curl -s --cacert "${CACERT}" -o /tmp/create-client.json -w '%{http_code}' \
            -X POST "${KC_BASE}/admin/realms/${REALM}/clients" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg aud "${SPA_CLIENT_ID}" '{
              clientId: "frames-e2e-test",
              enabled: true,
              publicClient: true,
              directAccessGrantsEnabled: true,
              standardFlowEnabled: false,
              protocolMappers: [{
                name: "frames-e2e-audience",
                protocol: "openid-connect",
                protocolMapper: "oidc-audience-mapper",
                config: {
                  "included.client.audience": $aud,
                  "id.token.claim": "false",
                  "access.token.claim": "true"
                }
              }]
            }')")
          [ "${CREATE_CLIENT_CODE}" = "201" ] \
            || { echo "::error::client provisioning failed (HTTP ${CREATE_CLIENT_CODE})"; cat /tmp/create-client.json; exit 1; }

          # e2e/templates_test.go asserts can_manage for the seeded admin, and
          # frames grants that by matching a user's email against SEED_ADMIN_EMAIL
          # at first login (see backend/internal/seed), not by anything Keycloak
          # itself knows about - the Application spec below sets that email to
          # e2e@example.com. The realm's built-in "admin" user has a different
          # email and would only get frames' fail-closed default (no
          # membership, PermissionDenied), so this also needs its own user.
          E2E_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::${E2E_PASSWORD}"

          # firstName and lastName are not decoration. Keycloak's declarative
          # user profile is on by default and marks both required, so a user
          # created without them is left incomplete and the password grant
          # refuses with "Account is not fully set up" even though the account
          # exists and the password was accepted. requiredActions is cleared
          # explicitly for the same reason: a realm default such as
          # UPDATE_PASSWORD would block the grant the same way.
          CREATE_USER_CODE=$(curl -s --cacert "${CACERT}" -o /tmp/create-user.json -w '%{http_code}' \
            -X POST "${KC_BASE}/admin/realms/${REALM}/users" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" -H 'Content-Type: application/json' \
            -d '{"username":"frames-e2e","email":"e2e@example.com","emailVerified":true,"enabled":true,"firstName":"Frames","lastName":"E2E","requiredActions":[]}')
          [ "${CREATE_USER_CODE}" = "201" ] \
            || { echo "::error::user provisioning failed (HTTP ${CREATE_USER_CODE})"; cat /tmp/create-user.json; exit 1; }

          USER_ID=$(curl -s --cacert "${CACERT}" "${KC_BASE}/admin/realms/${REALM}/users?username=frames-e2e&exact=true" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" | jq -r '.[0].id')
          [ -n "${USER_ID}" ] && [ "${USER_ID}" != "null" ] \
            || { echo "::error::could not look up the id of the just-created frames-e2e user"; exit 1; }

          SET_PASSWORD_CODE=$(curl -s --cacert "${CACERT}" -o /dev/null -w '%{http_code}' \
            -X PUT "${KC_BASE}/admin/realms/${REALM}/users/${USER_ID}/reset-password" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg pw "${E2E_PASSWORD}" '{type: "password", value: $pw, temporary: false}')")
          [ "${SET_PASSWORD_CODE}" = "204" ] \
            || { echo "::error::setting the e2e user's password failed (HTTP ${SET_PASSWORD_CODE})"; exit 1; }

          TOKEN_RESPONSE=$(curl -s --cacert "${CACERT}" -X POST "${KC_BASE}/realms/${REALM}/protocol/openid-connect/token" \
            -d grant_type=password -d client_id=frames-e2e-test \
            -d username=frames-e2e -d "password=${E2E_PASSWORD}")
          ACCESS_TOKEN=$(echo "${TOKEN_RESPONSE}" | jq -r '.access_token')
          [ -n "${ACCESS_TOKEN}" ] && [ "${ACCESS_TOKEN}" != "null" ] \
            || {
              echo "::error::password grant failed: ${TOKEN_RESPONSE}"
              # "Account is not fully set up" says nothing about WHICH condition
              # is unmet, and the account is gone once the cluster is torn down.
              # Dump what the server thinks is outstanding so the next failure
              # is diagnosable from the log alone.
              echo "user record as Keycloak sees it:"
              curl -s --cacert "${CACERT}" "${KC_BASE}/admin/realms/${REALM}/users/${USER_ID}" \
                -H "Authorization: Bearer ${ADMIN_TOKEN}" \
                | jq '{enabled, emailVerified, requiredActions, firstName, lastName}'
              exit 1
            }

          echo "::add-mask::${ACCESS_TOKEN}"
          echo "access_token=${ACCESS_TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Blackbox RPC suite
        env:
          FRAMES_E2E_TOKEN: ${{ steps.token.outputs.access_token }}
        run: |
          export FRAMES_E2E_BASE_URL=https://frames.nebari.local
          # Without this guard a failed acquisition step above would leave
          # FRAMES_E2E_TOKEN empty, every test would skip via t.Skipf, and the
          # job would go green having asserted nothing - precisely the failure
          # the "Auth is really on" step exists to prevent for dev mode, and
          # the same trap applies here.
          [ -n "${FRAMES_E2E_TOKEN}" ] || { echo "::error::no token; the acquisition step failed"; exit 1; }

          # Take the serving certificate from the cluster rather than from the
          # path the sandbox action reports, which is a different certificate
          # altogether: pinning against it failed with a presented-versus-pinned
          # mismatch. curl never noticed, because OpenSSL anchors on a
          # self-signed certificate by exact match and the provisioning calls
          # above talk to a different host.
          #
          # The subtlety is which secret. The nebari-operator gives each
          # NebariApp its own Gateway listener with its own certificate, whose
          # only SAN is that app's hostname, and Envoy serves it for that SNI.
          # nebari-gateway-tls is merely the catch-all listener's certificate
          # (SANs: apex, keycloak, argocd) and is NOT what frames.nebari.local
          # presents - pinning it is what broke this job before. So resolve the
          # certificate from the listener matching the hostname under test
          # instead of naming a secret, which also survives a rename of the
          # operator's "<app>-<namespace>-tls" convention.
          #
          # Reading it over the authenticated kubeconfig means the expected
          # identity is learned from a trusted channel, not from the connection
          # being tested, which trusting-on-first-use would amount to.
          GW_NS=$(kubectl get gateway -A \
            -o jsonpath='{.items[?(@.metadata.name=="nebari-gateway")].metadata.namespace}')
          [ -n "${GW_NS}" ] || {
            echo "::error::no nebari-gateway Gateway in any namespace"
            kubectl get gateway -A 2>/dev/null || true
            exit 1
          }
          CERT_SECRET=$(kubectl -n "${GW_NS}" get gateway nebari-gateway \
            -o jsonpath='{.spec.listeners[?(@.hostname=="frames.nebari.local")].tls.certificateRefs[0].name}')
          [ -n "${CERT_SECRET}" ] || {
            echo "::error::no Gateway listener for frames.nebari.local, so the operator never provisioned its certificate"
            kubectl -n "${GW_NS}" get gateway nebari-gateway -o yaml || true
            exit 1
          }
          echo "pinning ${GW_NS}/${CERT_SECRET} (listener for frames.nebari.local)"
          kubectl -n "${GW_NS}" get secret "${CERT_SECRET}" \
            -o jsonpath='{.data.tls\.crt}' | base64 -d > /tmp/gateway-tls.crt
          export FRAMES_E2E_CA_CERT=/tmp/gateway-tls.crt

          # Fingerprints, so any future mismatch is explicable at a glance
          # instead of costing another sandbox run to characterise. The last two
          # must agree; the first is expected to differ.
          echo "certificate fingerprints:"
          printf '  action-reported path: %s\n' \
            "$(openssl x509 -in "${SSL_CERT_FILE}" -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2)"
          printf '  %s/%s tls.crt (pinned): %s\n' "${GW_NS}" "${CERT_SECRET}" \
            "$(openssl x509 -in /tmp/gateway-tls.crt -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2)"
          printf '  presented by the gateway: %s\n' \
            "$(openssl s_client -connect frames.nebari.local:443 -servername frames.nebari.local \
               </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2)"

          # What the trust anchor actually is, printed before the suite runs.
          # "certificate signed by unknown authority" names no cause, and the
          # cluster is gone by the time anyone reads the log, so a repeat would
          # otherwise cost another full sandbox run to explain. Expect a
          # self-signed leaf (CA:FALSE) whose only SAN is the hostname under
          # test; the harness pins that rather than chaining to it.
          echo "trust anchor at ${FRAMES_E2E_CA_CERT}:"
          openssl x509 -in "${FRAMES_E2E_CA_CERT}" -noout -subject -issuer -dates \
            -ext basicConstraints,keyUsage,subjectAltName 2>&1 || true
          echo "chain the gateway actually presents:"
          openssl s_client -connect frames.nebari.local:443 -servername frames.nebari.local \
            -showcerts </dev/null 2>/dev/null \
            | grep -E "^ *[0-9]+ s:|^ *i:|Verify return code" || true

          go test -tags e2e -count=1 -v ./e2e/...
